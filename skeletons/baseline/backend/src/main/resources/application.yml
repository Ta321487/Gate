server:
  port: 8080

spring:
  application:
    name: thesis-app
  servlet:
    multipart:
      max-file-size: 10MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # AI 助手：Spring AI + DeepSeek（Key 用环境变量；无 Key 时问答回落本地知识表）
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 课题业务配置（按本系统启用的功能填写）
thesis:
  title: ${PROJECT_TITLE}
  register-role: user
  password-hash: none
